# ──────────────────────────────────────────────────────────────────────────
# Paste inside the BEGIN LOCATIONS / END LOCATIONS region of
# bajaj-ai-infra/shared/nginx.conf, then:
#
#   sudo podman exec shared-nginx nginx -t          # ALWAYS test first
#   sudo podman exec shared-nginx nginx -s reload   # reload, never restart
#
# Two blocks, and the order and TYPE of each matters. This mirrors the
# compliance-agent pattern, which is the same shape: a Next.js app with a
# basePath behind lazy hostname resolution.
# ──────────────────────────────────────────────────────────────────────────

# Sales Disposition Reconciliation Portal
#
# Next.js with basePath=/reconciliation and trailingSlash=false. It serves the
# index at the BARE /reconciliation (200) and 308-redirects /reconciliation/
# back to /reconciliation. The canonical URL therefore has NO trailing slash.
#
#   * `location = /reconciliation` (EXACT) — a bare prefix `location
#     /reconciliation` makes nginx 301 to /reconciliation/, which Next then
#     308s back to /reconciliation => infinite redirect loop. An exact match is
#     terminal and does NOT auto-append the slash.
#   * `location /reconciliation/` (PREFIX) — serves /reconciliation/_next/...,
#     /reconciliation/api/... and everything else.
#
# Do NOT rewrite the prefix away. With a variable proxy_pass and no URI part,
# nginx forwards $uri unchanged, which is exactly what basePath expects.
#
# Neither block includes proxy_params.conf, and that is deliberate — see the
# timeout note below. The headers it would have set are spelled out instead.

location = /reconciliation {
    set $reconciliation http://reconciliation-app:3008;
    proxy_pass $reconciliation;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # nginx defaults client_max_body_size to 1 MB. The source workbook is
    # 9.14 MB and a correction carries up to five 10 MB proof documents, so
    # without this EVERY import and EVERY proof upload dies here with a 413
    # before Next sees it — and the application's own size checks, which name
    # the offending file and its size, never get to run.
    client_max_body_size 64m;

    # proxy_params.conf sets proxy_read_timeout 60s. Committing 1,171 rows plus
    # their version snapshots can exceed that, so these blocks need 180s — and
    # re-declaring the directive alongside the include is an nginx [emerg] that
    # takes the WHOLE platform's config down, not just this route. Spelling the
    # headers out instead is what /seo/api/ already does, for this same reason.
    proxy_connect_timeout 60s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;
}

location /reconciliation/ {
    set $reconciliation http://reconciliation-app:3008;
    proxy_pass $reconciliation;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    client_max_body_size 64m;

    proxy_connect_timeout 60s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;
}
