# ──────────────────────────────────────────────────────────────────────────
# Deployment onto the Bajaj AI Platform shared stack (RHEL 9 / Podman,
# 10.3.5.99). Lives at /opt/reconciliation-agent/ on the VM.
#
# Follows the platform constraints in bajaj-ai-infra/README.md exactly:
#   * ONLY this agent's own containers — no postgres, no redis, no nginx
#   * joins the EXISTING shared-network, never recreates it
#   * no `ports:` — shared-nginx is the only ingress and binds :80 itself
#   * pull_policy: never, with a full image path
#
# Two containers: `reconciliation-app` (the Next.js portal, routed by nginx at
# /reconciliation) and `reconciliation-ingest` (the Python parser, routed
# nowhere — see the comment on that service). They share one database and one
# storage volume; nothing else passes between them.
#
#   sudo podman-compose -f docker-compose.shared.yml up -d
#   sudo podman exec shared-nginx nginx -s reload
# ──────────────────────────────────────────────────────────────────────────
services:
  reconciliation-app:
    # One container, not the usual frontend/backend pair: this is a Next.js
    # server that owns both the UI and the Server Actions, so there is no
    # separate backend to run. monitoring-agent already sets the precedent for
    # an agent that does not fill both columns of the port registry.
    image: localhost/reconciliation-app:latest
    container_name: reconciliation-app
    pull_policy: never
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: "3008"
      HOSTNAME: 0.0.0.0

      # shared-postgres by container name over shared-network. The database and
      # least-privilege role are created by shared/init-db.sh; the password must
      # match RECONCILIATION_DB_PASSWORD in shared/.env.
      DATABASE_URL: postgresql://reconciliation_user:${RECONCILIATION_DB_PASSWORD}@shared-postgres:5432/reconciliation_db

      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # ORIGIN ONLY. No /reconciliation, no /api/auth — just scheme and host.
      #
      # Better Auth mounts its router at `new URL(baseURL).pathname` exactly
      # (better-auth/dist/api/index.mjs) and strips that prefix before matching
      # endpoints named /sign-in/email. Next strips `basePath` from the request
      # BEFORE a Route Handler sees it, so what reaches Better Auth is already
      # /api/auth/sign-in/email with no /reconciliation on it. Leaving the path
      # off lets getBaseURL() append its /api/auth default, which lines up
      # exactly.
      #
      # Verified by running the standalone build behind basePath=/reconciliation
      # and POSTing to /reconciliation/api/auth/sign-in/email:
      #   BETTER_AUTH_URL=http://host                     -> reaches the handler
      #   BETTER_AUTH_URL=http://host/api/auth            -> reaches the handler
      #   BETTER_AUTH_URL=http://host/reconciliation      -> 404
      #   BETTER_AUTH_URL=http://host/reconciliation/api/auth -> 404
      #
      # Putting the basePath here mounts the router at /reconciliation, so every
      # auth request 404s while the rest of the app works perfectly — which is
      # what shipped, and why login never worked on the VM.
      #
      # The host must also be the one USERS TYPE: this origin is trusted by
      # default, and a sign-in from an untrusted origin is refused as
      # INVALID_ORIGIN, which the login form shows as a wrong password.
      BETTER_AUTH_URL: http://bajajlife-marketing-ai.bajajlifeinsurance.com

      # Every origin this deployment answers on. Scheme and host only, no path,
      # comma-separated. The BETTER_AUTH_URL origin is trusted automatically;
      # it is listed anyway so this does not depend on how Better Auth derives
      # it. Restarting the container is enough to add one — see TRUSTED_ORIGINS
      # in src/lib/env.ts.
      TRUSTED_ORIGINS: http://10.3.5.99,http://bajajlife-marketing-ai.bajajlifeinsurance.com

      # NEXT_PUBLIC_APP_URL is deliberately absent. It did nothing here: Next
      # inlines NEXT_PUBLIC_ values at BUILD time, so setting it at run time
      # never reached the browser bundle, and the auth client shipped pointing at
      # http://localhost:3000. The client now derives its origin from
      # window.location at run time and needs no variable at all — see
      # src/lib/auth/client.ts.

      # KNOWN GAP, deliberate. shared-nginx serves plain HTTP on :80, and a
      # Secure cookie there is accepted by the browser and then never sent
      # back — an infinite login loop that presents as a wrong password.
      # Session cookies therefore cross the corporate LAN in clear text.
      # Reverse this the moment TLS terminates at shared-nginx; shared/certs/
      # already exists for it. See docs/deploy-vm.md.
      COOKIE_SECURE: "false"

      # Where the portal reaches the parser. Container name over shared-network
      # on the port the ingest image listens on — 8006, not 8005; see the note
      # on reconciliation-ingest below. No basePath and no nginx hop: this is a
      # container-to-container call that never leaves the network.
      INGEST_URL: http://reconciliation-ingest:8006

      # The SAME value the ingest container gets. Sent as X-Ingest-Token on
      # every call; a mismatch is a 404 on every parse, not a 401, so it
      # presents as "the service lost my job" rather than as an auth failure.
      INGEST_TOKEN: ${INGEST_TOKEN}

    volumes:
      # A NAMED volume, never a bind mount into the container's own filesystem.
      # This holds uploaded workbooks, proof attachments and generated exports —
      # the customer documents and the evidence that a record's original value
      # was what it claims. Losing them on the next `podman-compose up` would
      # break the base spec's guarantee that the original survives three
      # independent ways.
      - reconciliation-storage:/app/storage

    networks:
      - shared-network

    # No `ports:`. Reachable only as reconciliation-app:3008 from shared-nginx.

    logging:
      driver: k8s-file
      options:
        path: /var/log/apps/reconciliation.log
        max-size: 200m

  # ────────────────────────────────────────────────────────────────────────
  # reconciliation-ingest — workbook parsing and proof inspection.
  #
  # Exists because parsing the 9.14 MB .xlsb takes ~74.6 s through SheetJS in
  # Node and 0.33 s through calamine in Python, and because Lead Dump declares
  # a 54,508 x 16,383 range that any reader materialising it dies on. See
  # docs/superpowers/specs/2026-07-28-ingestion-service-design.md.
  #
  # It is INTERNAL. There is no nginx location for it and there must not be:
  # it authenticates no humans and has no UI, so a public route would put an
  # unauthenticated-by-design service on the network edge. Only
  # reconciliation-app calls it, by container name over shared-network.
  # ────────────────────────────────────────────────────────────────────────
  reconciliation-ingest:
    image: localhost/reconciliation-ingest:latest
    container_name: reconciliation-ingest
    pull_policy: never
    restart: unless-stopped

    environment:
      # The SAME database as the portal. Two writers, disjoint tables: Drizzle
      # owns the schema and the app's tables, this service writes only
      # ingest_job, upload_batch_row and lead. It never runs DDL — it verifies
      # on startup that the columns it writes exist and refuses to start if
      # they do not, so a schema drift fails here rather than mid-upload.
      DATABASE_URL: postgresql://reconciliation_user:${RECONCILIATION_DB_PASSWORD}@shared-postgres:5432/reconciliation_db

      # Must match the mount path below. The service resolves every stored
      # path against this root and refuses anything that escapes it, the same
      # check resolveStoredPath() makes on the Node side.
      STORAGE_ROOT: /app/storage

      # THE ONLY THING PROTECTING THIS SERVICE. It binds no host port, but
      # shared-network carries every other agent on the platform, and any
      # container on it can reach reconciliation-ingest:8006. There is no
      # session, no user, and no second factor — this token is the whole
      # boundary. It MUST be 32+ characters: the service refuses to start on a
      # shorter one, because a short secret that looks like a control is worse
      # than no control at all. Same value as the portal's INGEST_TOKEN above;
      # generate once (`openssl rand -hex 32`) and keep it in .env, chmod 600.
      INGEST_TOKEN: ${INGEST_TOKEN}

    volumes:
      # THE SAME named volume as reconciliation-app, and this sharing is the
      # entire integration: the portal writes the uploaded workbook, hands over
      # only its stored path, and this service reads that file straight off the
      # volume. Point it somewhere else and every parse fails with "no stored
      # file at ..." while both containers look perfectly healthy.
      #
      # Both images run as uid 1001 so the portal's files are readable and
      # writable here; changing the uid in either Dockerfile silently breaks
      # that.
      - reconciliation-storage:/app/storage

    networks:
      - shared-network

    # No `ports:`. Reachable only as reconciliation-ingest:8006, from
    # reconciliation-app, on shared-network.

    logging:
      driver: k8s-file
      options:
        path: /var/log/apps/reconciliation-ingest.log
        max-size: 200m

volumes:
  reconciliation-storage:

networks:
  shared-network:
    external: true
